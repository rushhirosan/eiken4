{# アフィリエイト外部リンクの outbound click を GA4 へ送る。data-affiliate-click 付き <a> が対象。 #}
<script>
(function () {
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('[data-affiliate-click]') : null;
    if (!a || typeof gtag !== 'function') {
      return;
    }
    gtag('event', 'affiliate_outbound_click', {
      placement: a.getAttribute('data-affiliate-placement') || '',
      level: a.getAttribute('data-affiliate-level') || '',
      link_label: a.getAttribute('data-affiliate-label') || (a.textContent || '').trim().slice(0, 80)
    });
  });
})();
</script>
