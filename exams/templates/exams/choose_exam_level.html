<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>級を選ぶ - えいごごはん</title>
    {% include 'partials/_favicon.html' %}
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #7c6cff;
            --brand-primary-deep: #6355e0;
            --brand-primary-soft: #5b8cff;
            --brand-accent-teal: #4fd1c5;
            --brand-bg: #f4f5fb;
            --brand-bg-soft: #eef0f8;
            --brand-surface: #ffffff;
            --brand-text: #1a1f36;
            --brand-muted: #5c6578;
            --brand-border: rgba(26, 31, 54, 0.08);
            --brand-primary-rgb: 124, 108, 255;
        }

        body {
            background-color: var(--brand-bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 0% 0%, rgba(124, 108, 255, 0.14), transparent 55%),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(79, 209, 197, 0.12), transparent 50%),
                linear-gradient(180deg, var(--brand-bg) 0%, var(--brand-bg-soft) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--brand-text);
        }

        .choose-wrap {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        .choose-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .choose-brand {
            display: inline-block;
            font-weight: 700;
            color: var(--brand-primary);
            text-decoration: none;
            margin-bottom: 1rem;
        }

        .choose-header h1 {
            font-size: clamp(1.5rem, 4vw, 1.85rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .choose-header p {
            color: var(--brand-muted);
            margin-bottom: 0;
        }

        .level-card {
            display: block;
            height: 100%;
            text-decoration: none;
            color: inherit;
            background: var(--brand-surface);
            border: 1px solid var(--brand-border);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(26, 31, 54, 0.08);
            padding: 1.35rem 1.25rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .level-card:hover,
        .level-card:focus {
            transform: translateY(-3px);
            border-color: rgba(var(--brand-primary-rgb), 0.35);
            box-shadow: 0 16px 40px rgba(26, 31, 54, 0.12);
            color: inherit;
            outline: none;
        }

        .level-card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .level-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--brand-primary);
            background: rgba(var(--brand-primary-rgb), 0.12);
            border-radius: 999px;
            padding: 0.2rem 0.65rem;
        }

        .level-summary {
            color: var(--brand-muted);
            font-size: 0.92rem;
            margin: 0.85rem 0 1rem;
            line-height: 1.55;
        }

        .level-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--brand-muted);
            background: #f0f2f8;
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            margin: 0 0.25rem 0.25rem 0;
        }

        .level-cta {
            display: inline-block;
            margin-top: 0.75rem;
            font-weight: 600;
            color: var(--brand-primary);
        }

        .skip-wrap {
            text-align: center;
            margin-top: 1.75rem;
        }

        .skip-wrap .btn-link {
            color: var(--brand-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .skip-wrap .btn-link:hover {
            color: var(--brand-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="choose-wrap">
        <div class="choose-header">
            <a class="choose-brand" href="/">えいごごはん</a>
            <h1>受験する級を選んでください</h1>
            <p>あとから問題一覧でいつでも変更できます。</p>
        </div>

        <div class="row g-3">
            {% for card in level_cards %}
            <div class="col-md-4">
                <a class="level-card" href="{% url 'exams:choose_exam_level' %}?level={{ card.code }}">
                    <div class="d-flex align-items-center justify-content-between gap-2">
                        <h2>{{ card.name }}</h2>
                        <span class="level-badge">{{ card.badge }}</span>
                    </div>
                    <p class="level-summary">{{ card.summary }}</p>
                    <div>
                        {% for tag in card.tags %}
                        <span class="level-tag">{{ tag }}</span>
                        {% endfor %}
                    </div>
                    <span class="level-cta">{{ card.name }}で始める →</span>
                </a>
            </div>
            {% endfor %}
        </div>

        <div class="skip-wrap">
            <form method="post" action="{% url 'exams:choose_exam_level' %}">
                {% csrf_token %}
                <input type="hidden" name="skip" value="1">
                <button type="submit" class="btn btn-link">わからない・あとで決める（4級で始める）</button>
            </form>
        </div>
    </main>
</body>
</html>
