{% load static %}
{# リスニングイラスト結果の画像・音声。answer.question に image / audio がある想定 #}
{% if answer.question.image %}
<div class="listening-illustration-img-wrap listening-illustration-img-wrap--results">
    <img src="{% static answer.question.image %}" alt="問題のイラスト" class="listening-illustration-img">
</div>
{% endif %}
{% if answer.question.audio %}
<div class="text-center listening-illustration-audio-wrap mb-3">
    <audio controls>
        <source src="{% static answer.question.audio %}" type="audio/mpeg">
        お使いのブラウザは音声再生に対応していません。
    </audio>
</div>
{% endif %}
