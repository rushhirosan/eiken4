{% if habit_summary %}
<div class="exam-habit-status text-center mb-2 px-2">
    <div class="exam-habit-status-line mb-0 small">
        {% with streak=habit_summary.streak badges=habit_summary.badges %}
        <span class="exam-habit-group exam-habit-streak-group">
            {% if streak.current_streak > 0 %}
            <button type="button"
                    class="btn btn-link btn-sm exam-habit-streak-btn p-0"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-custom-class="exam-habit-streak-tooltip"
                    title="{{ streak.rule_tooltip }}"
                    aria-label="ストリーク {{ streak.current_streak }}日: {{ streak.rule_tooltip }}">
                <span aria-hidden="true">🔥</span> {{ streak.current_streak }}日
            </button>
            {% elif streak.hint %}
            <button type="button"
                    class="btn btn-link btn-sm exam-habit-streak-btn exam-habit-streak-btn-muted p-0"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-custom-class="exam-habit-streak-tooltip"
                    title="{{ streak.rule_tooltip }}"
                    aria-label="ストリーク: {{ streak.hint }} {{ streak.rule_tooltip }}">
                {{ streak.hint }}
            </button>
            {% endif %}
        </span>
        {% if badges.total_count %}
        <span class="exam-habit-group exam-habit-badge-group">
            <button type="button"
                    class="btn btn-link btn-sm exam-habit-badge-btn p-0"
                    data-bs-toggle="modal"
                    data-bs-target="#badgeCollectionModal"
                    aria-label="集めたバッジ {{ badges.earned_count }}個">
                <span aria-hidden="true">🏅</span> {{ badges.earned_count }}
            </button>
        </span>
        {% endif %}
        {% if streak.grace_notice %}
        <span class="exam-habit-grace-notice text-muted">{{ streak.grace_notice }}</span>
        {% endif %}
        {% endwith %}
    </div>
</div>
{% endif %}
